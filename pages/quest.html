    <div class="junpoko-mission-card" data-mission="daily3"><span>⑤ トレーニングを<br>3日分達成</span><strong id="missionDaily3">0/3</strong></div>
    <div class="junpoko-mission-card" data-mission="longPress"><span>⑥ JunPokoを<br>秘密コマンド</span><strong id="missionLongPress">0/1</strong></div>
  </div>
