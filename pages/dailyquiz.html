<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ea580c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GET">
  <title>Daily Quiz - GET</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../assets/images/sheep.PNG">
  <link rel="stylesheet" href="../style.css?v=10">
  <link rel="stylesheet" href="../css/foundation.css?v=1" data-get-foundation>
  <link rel="stylesheet" href="../css/quiz.css?v=4">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>
  <main class="container quiz-container">
    <h1>Daily Quiz</h1>
    <p>Daily Pokémon EN Challenge</p>

    <section class="quiz-card" id="quizCard">
      <div class="quiz-status">
        <span id="quizCount">1 / 10</span>
        <span id="quizScore">Score 0</span>
      </div>
      <div class="quiz-question-label">このポケモンの英語名は？</div>
      <div class="quiz-question" id="quizQuestion">Loading...</div>
      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-result" id="quizResult" aria-live="polite"></div>
      <button class="quiz-next-button" id="quizNextButton" onclick="nextQuiz()" disabled hidden aria-hidden="true" type="button">Next</button>
    </section>
  </main>

  <audio id="enquestBgm" src="../assets/sounds/enquest-bgm.mp3" loop preload="none"></audio>
  <script src="../js/app-settings.js?v=2"></script>
  <script src="../js/pokemon-data.js?v=1"></script>
  <script src="../script.js?v=7"></script>
  <script src="../js/quiz.js?v=5"></script>
  <script src="../js/quiz-data-bridge.js?v=1"></script>
</body>
</html>
