<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ea580c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GET">
  <title>Pokémon Name Bank - GET</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../assets/images/sheep.PNG">
  <link rel="stylesheet" href="../style.css?v=10">
  <link rel="stylesheet" href="../css/foundation.css?v=1" data-get-foundation>
  <link rel="stylesheet" href="../css/bank.css?v=6">
  <link rel="stylesheet" href="../css/bank-v2.css?v=2">
</head>
<body>
  <main class="container">
    <h1>Name Bank</h1>
    <p>Pokémon EN Name Database</p>

    <div class="search-area">
      <input type="search" id="pokemonSearch" class="pokemon-search" placeholder="Search Pokémon name..." aria-label="ポケモン検索">
      <button id="searchButton" class="search-button" type="button">Search</button>
    </div>

    <div class="filter-area" aria-label="世代フィルター">
      <button class="filter-button active" data-gen="all" type="button">All</button>
      <button class="filter-button" data-gen="1" type="button">Gen 1</button>
      <button class="filter-button" data-gen="2" type="button">Gen 2</button>
      <button class="filter-button" data-gen="3" type="button">Gen 3</button>
      <button class="filter-button" data-gen="4" type="button">Gen 4</button>
      <button class="filter-button" data-gen="5" type="button">Gen 5</button>
      <button class="filter-button" data-gen="6" type="button">Gen 6</button>
      <button class="filter-button" data-gen="7" type="button">Gen 7</button>
      <button class="filter-button" data-gen="8" type="button">Gen 8</button>
      <button class="filter-button" data-gen="9" type="button">Gen 9</button>
    </div>

    <div class="type-filter-row">
      <label for="typeFilter">タイプ</label>
      <select id="typeFilter">
        <option value="all">すべて</option>
        <option value="ノーマル">ノーマル</option>
        <option value="ほのお">ほのお</option>
        <option value="みず">みず</option>
        <option value="でんき">でんき</option>
        <option value="くさ">くさ</option>
        <option value="こおり">こおり</option>
        <option value="かくとう">かくとう</option>
        <option value="どく">どく</option>
        <option value="じめん">じめん</option>
        <option value="ひこう">ひこう</option>
        <option value="エスパー">エスパー</option>
        <option value="むし">むし</option>
        <option value="いわ">いわ</option>
        <option value="ゴースト">ゴースト</option>
        <option value="ドラゴン">ドラゴン</option>
        <option value="あく">あく</option>
        <option value="はがね">はがね</option>
        <option value="フェアリー">フェアリー</option>
      </select>
      <span id="resultCount" class="result-count" aria-live="polite"></span>
    </div>

    <div id="pokemonList" class="pokemon-list">Loading...</div>
  </main>

  <button id="scrollTopBtn" class="side-top-button" onclick="scrollToTop()" type="button">上へ</button>
  <button id="sideRateButton" class="side-rate-button" onclick="changeSpeechRate()" type="button">速さ：通常</button>

  <script src="../js/app-settings.js?v=2"></script>
  <script src="../js/pokemon-data.js?v=1"></script>
  <script src="../script.js?v=7"></script>
  <script src="../js/pokemon.js?v=17"></script>
</body>
</html>
